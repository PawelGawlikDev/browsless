name: Release MCP companion

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Bun
        run: npm install --global bun@1.4.2

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          test "$GITHUB_REF_NAME" = "mcp-v$version"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:mcp
      - run: bun run lint
      - run: bunx --no-install eslint packages/mcp/src packages/mcp/scripts scripts/build-mcp.mjs
      - run: bun run build:mcp

      - name: Pack MCP companion
        working-directory: packages/mcp
        run: bun pm pack

      - name: Check packaged MCP
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          BROWSLESS_MCP_ARCHIVE="$PWD/packages/mcp/browsless-mcp-$version.tgz" bun run check:mcp

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          flags=()
          if [[ "${version%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "packages/mcp/browsless-mcp-$version.tgz" \
            --verify-tag \
            --title "Browsless MCP $version" \
            --generate-notes \
            --latest=false \
            "${flags[@]}"
